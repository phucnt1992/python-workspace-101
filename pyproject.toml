# For more information about the pyproject.toml file, see:
# https://docs.astral.sh/uv/concepts/projects/dependencies/#build-dependencies
[project]
name = "python-workspace-101"
version = "1.0.0"
description = "A simple Python project to demonstrate workspace setup."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastapi", "sqlmodel", "pydantic"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "ci" },
]
lint = ["ruff"]
test = ["pytest", "pytest-cov"]
ci = ["pre-commit"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".env",
    ".vscode",
    "__pycache__",
    ".ruff_cache",
    ".devcontainer",
    "node_modules",
]
target-version = "py313"
line-length = 120
indent-width = 4
