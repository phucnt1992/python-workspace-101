version: 3

vars:
  PYTHON_VERSION: "3.13"

tasks:
  default:
    desc: "Default task to run when no task is specified."
    cmd: task --list

  init:
    desc: "Initialize the project by installing dependencies inside the devcontainer."
    cmds:
      - uv python install {{.PYTHON_VERSION}} --compile-bytecode
      - uv venv --python {{.PYTHON_VERSION}} --clear
      - uv sync --compile-bytecode
      - uv run pre-commit install
      - uv run playwright install chromium

  lint:
    desc: "Run linters to check code quality."
    cmds:
      - uv run ruff check

  fmt:
    desc: "Format code using uv."
    cmds:
      - uv run ruff format {{.CLI_ARGS}}

  test-cli:
    desc: "Run CLI tests."
    cmds:
      - uv run pytest --cov=src tests/cli/

  test-api:
    desc: "Run API tests."
    cmds:
      - uv run pytest --cov=src tests/api/

  test:
    desc: "Run tests."
    cmds:
      - uv run pytest --cov=src tests/api tests/cli tests/e2e/

  test-e2e:
    desc: "Run browser E2E tests for the HTMX Todo UI."
    cmds:
      - uv run pytest tests/e2e/ -v

  test-cov:
    desc: "Run tests and generate coverage report."
    cmds:
      - uv run pytest --cov=src tests/api tests/cli

  ci:
    desc: "Run CI checks (lint and tests)."
    cmds:
      - task: lint
      - task: test

  sync:
    desc: "Sync the virtual environment with the lock file."
    cmds:
      - uv sync --compile-bytecode

  pre-commit:
    desc: "Run pre-commit hooks to check code before committing."
    cmds:
      - uv run pre-commit run --all-files

  aspire:
    desc: "Run the Aspire resource service locally."
    cmds:
      - aspire run

  cli:
    desc: "Run the CLI application."
    cmds:
      - uv run src/cli/src/cli/main.py {{.CLI_ARGS}}

  app:
    desc: "Run the FastAPI application."
    cmds:
      - uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  act:
    desc: "Run the application using Act for local testing of GitHub Actions."
    cmds:
      - act -j ci --env-file .env
