version: 3

tasks:
  init:
    desc: "Initialize the project by installing dependencies."
    cmds:
      - uv venv --python 3.13
      - uv sync

  lint:
    desc: "Run linters to check code quality."
    cmds:
      - uv run ruff check

  test:
    desc: "Run tests and generate coverage report."
    cmds:
      - uv run pytest --cov=src tests/

  pre-commit:
    desc: "Run pre-commit hooks to check code before committing."
    cmds:
      - pre-commit run --all-files

  dashboard-token:
    desc: "Generate a token for the Aspire dashboard."
    cmds:
      - loginLine=$(docker container logs aspire-dashboard | grep "login?t=")
      - match=$(echo "$loginLine" | sed -n 's/.*login?t=\([^[:space:]]*\).*/\1/p')
      - echo -n "$match"
